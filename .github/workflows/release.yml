name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux (x86_64, cpu)
    uses: ./.github/workflows/_build-linux.yml
    with:
      hardware: cpu
      use_libtorch: true
      build_tests: true
      run_dotnet_tests: true
      save_cache: true
      release_version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      package_suffix: linux-x86_64-cpu
      artifact_name: rope-linux-x86_64-cpu
      cache_key: deps-linux-x64-cpu-ort1.25.0-torch2.7.0

  build-macos-arm64:
    name: macOS (arm64, cpu)
    uses: ./.github/workflows/_build-macos.yml
    with:
      hardware: cpu
      use_libtorch: true
      build_tests: true
      run_dotnet_tests: true
      save_cache: true
      release_version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      package_suffix: macos-arm64-cpu
      artifact_name: rope-macos-arm64-cpu
      cache_key: deps-macos-arm64-cpu-ort1.25.0-torch2.7.0

  build-linux-cuda12:
    name: Linux (x86_64, cuda12)
    uses: ./.github/workflows/_build-linux.yml
    with:
      hardware: cuda12
      use_libtorch: false
      build_tests: true
      run_dotnet_tests: true
      save_cache: true
      release_version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      package_suffix: linux-x86_64-cuda12
      artifact_name: rope-linux-x86_64-cuda12
      cache_key: deps-linux-x64-cuda12-ort1.25.0

  build-windows:
    name: Windows (x64, cpu)
    uses: ./.github/workflows/_build-windows.yml
    with:
      hardware: cpu
      use_libtorch: true
      build_tests: true
      run_dotnet_tests: true
      save_cache: true
      release_version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      package_suffix: windows-x64-cpu
      artifact_name: rope-windows-x64-cpu
      cache_key: deps-windows-x64-cpu-ort1.25.0-torch2.7.0

  build-windows-cuda12:
    name: Windows (x64, cuda12)
    uses: ./.github/workflows/_build-windows.yml
    with:
      hardware: cuda12
      use_libtorch: false
      build_tests: true
      run_dotnet_tests: true
      save_cache: true
      release_version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      package_suffix: windows-x64-cuda12
      artifact_name: rope-windows-x64-cuda12
      cache_key: deps-windows-x64-cuda12-ort1.25.0

  pack-dotnet:
    name: Pack .NET (NuGet)
    needs: [build-linux, build-windows, build-macos-arm64]
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: rope-linux-x86_64-cpu
          path: artifacts/linux
      - uses: actions/download-artifact@v4
        with:
          name: rope-windows-x64-cpu
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: rope-macos-arm64-cpu
          path: artifacts/macos

      - name: Extract native binaries
        run: |
          mkdir -p native
          tar -xzf artifacts/linux/rope_framework-*.tar.gz -C artifacts/linux
          unzip -q artifacts/windows/rope_framework-*.zip -d artifacts/windows
          tar -xzf artifacts/macos/rope_framework-*.tar.gz -C artifacts/macos
          find artifacts/linux   -path '*/lib/*.so*'           -exec cp {} native/ \;
          find artifacts/macos   -path '*/lib/*.dylib'         -exec cp {} native/ \;
          find artifacts/linux   -path '*/bin/rope'            -exec cp {} native/rope.bin \;
          find artifacts/macos   -path '*/bin/rope'            -exec cp {} native/rope-osx.bin \;
          find artifacts/windows -path '*/bin/*' \( -iname '*.dll' -o -iname '*.exe' \) -exec cp {} native/ \;
          ls native/

      - name: Pack
        id: pack
        run: |
          VERSION_FLAG=""
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION_FLAG="-p:Version=${GITHUB_REF_NAME#v}"
          fi
          dotnet pack dotnet/Rope.csproj -c Release -o nupkg \
            -p:RopeNativeDir="${{ github.workspace }}/native" $VERSION_FLAG
          echo "version=$(basename nupkg/RopeFramework.*.nupkg .nupkg | sed 's/^RopeFramework\.//')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: rope-dotnet-nupkg
          path: nupkg/*.nupkg
          retention-days: 1

  smoke-test-dotnet:
    name: Smoke test .NET package (Windows)
    needs: [pack-dotnet, build-windows]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: rope-dotnet-nupkg
          path: nupkg

      # coae_decoder.pt is gitignored (regenerated by ctest, not checked in) — this is a
      # fresh checkout with no build, so pull the one build-windows already generated.
      - uses: actions/download-artifact@v4
        with:
          name: rope-test-fixtures-windows-x64-cpu
          path: tests/fixtures/test_models

      # Consumes the actual packed release nupkg exactly like a real NuGet user would —
      # catches native-file bundling regressions (e.g. missing OpenSSL DLLs) that only
      # show up in the real cpack-produced archive, not in a fresh local `cmake --install`.
      - name: Consume packed nupkg
        run: |
          @"
          [paths]
          exported_dir = $env:GITHUB_WORKSPACE\tests\fixtures\test_models
          driver_path  = $env:GITHUB_WORKSPACE\tests\fixtures\test_models\sw_test.swbin
          [server]
          idle_timeout_seconds = 30
          "@ | Out-File -FilePath "$env:RUNNER_TEMP\release-smoke-rope.conf" -Encoding utf8

          dotnet restore tests/dotnet/PackSmokeConsumer/PackSmokeConsumer.csproj `
            -p:RopeSmokeTestVersion="${{ needs.pack-dotnet.outputs.version }}" `
            "-p:RestoreAdditionalProjectSources=$env:GITHUB_WORKSPACE\nupkg"

          dotnet build tests/dotnet/PackSmokeConsumer/PackSmokeConsumer.csproj -c Release --no-restore

          # libcrypto/libssl are OpenSSL, pulled in dynamically by cpp-httplib for rope_net (driver-cache HTTPS client).
          foreach ($tfm in @("net48", "net8.0")) {
            $outDir = "tests/dotnet/PackSmokeConsumer/bin/Release/$tfm"
            foreach ($f in @("librope.dll", "rope.exe", "libcrypto-3-x64.dll", "libssl-3-x64.dll")) {
              if (!(Test-Path (Join-Path $outDir $f))) {
                Write-Error "$f missing from $tfm build output — packaging regression"
                exit 1
              }
            }
          }

          dotnet tests/dotnet/PackSmokeConsumer/bin/Release/net8.0/PackSmokeConsumer.dll "$env:RUNNER_TEMP\release-smoke-rope.conf"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          tests/dotnet/PackSmokeConsumer/bin/Release/net48/PackSmokeConsumer.exe "$env:RUNNER_TEMP\release-smoke-rope.conf"
          if ($LASTEXITCODE -ne 0) { exit 1 }

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-linux-cuda12, build-macos-arm64, build-windows, build-windows-cuda12, pack-dotnet, smoke-test-dotnet]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          body: |
            ## Required assets

            The following directories are not included in the release archives and must be downloaded separately:

            - `data/models/` — model artifacts
            - `data/drivers/` — driver/space-weather data

            **Downloads:** [Google Drive](https://drive.google.com/drive/folders/1gVQ0gqzwfKDaZIuT8tWoCyWQOL_hT4Ol?usp=drive_link)

            Place both folders alongside the extracted archive before running the server.

      - name: Delete staging artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { data: { artifacts } } =
              await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                run_id: context.runId,
              });
            for (const artifact of artifacts) {
              if (artifact.name.startsWith('rope-')) {
                await github.rest.actions.deleteArtifact({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  artifact_id: artifact.id,
                });
                core.info(`Deleted: ${artifact.name}`);
              }
            }
